# Render Blueprint: https://render.com/docs/blueprint-spec
# Dashboard → New + → Blueprint → connect GitHub repo → branch main

services:
  - type: web
    name: yoenia-portfolio
    runtime: docker
    region: frankfurt
    plan: free
    branch: main
    autoDeployTrigger: commit
    healthCheckPath: /
    dockerfilePath: ./Dockerfile
    envVars:
      - key: JAVA_TOOL_OPTIONS
        value: -XX:+UseContainerSupport -Xmx384m
